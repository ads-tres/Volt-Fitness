# Runs `flutter analyze` and `flutter test` on every push and pull request,
# with the Flutter version the app is built with.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  android:
    name: Build ${{ matrix.app }} for Android
    runs-on: ubuntu-latest
    strategy:
      # Each app reports its own build, even when the other fails.
      fail-fast: false
      matrix:
        include:
          - app: the member app
            flavor: dev
            target: lib/main.dart
          - app: the front desk app
            flavor: staffDev
            target: lib/main_staff.dart

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Build a debug APK
        run: flutter build apk --debug --flavor ${{ matrix.flavor }} -t ${{ matrix.target }}

      # The member app never asks for the camera; the front desk app does.
      - name: Check the camera permission
        run: |
          apk=build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-debug.apk
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort | tail -1)
          if [ "${{ matrix.flavor }}" = staffDev ]; then
            "$aapt" dump permissions "$apk" | grep -q 'android.permission.CAMERA'
          else
            ! "$aapt" dump permissions "$apk" | grep -q 'android.permission.CAMERA'
          fi
